<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aso-ebi · Run of Show</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#5b2a6e">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="title">
        <h1 id="ev-name">Loading…</h1>
        <div class="muted small" id="ev-sub"></div>
      </div>
      <nav class="sections" id="sections"></nav>
    </div>
  </header>
  <main class="wrap">
    <section class="stats five">
      <div class="card stat"><div class="n" id="s-orders">0</div><div class="l">Orders</div></div>
      <div class="card stat"><div class="n" id="s-pieces">0</div><div class="l">Pieces</div></div>
      <div class="card stat"><div class="n" id="s-ordered">₦0</div><div class="l">Ordered</div></div>
      <div class="card stat"><div class="n" id="s-paid">₦0</div><div class="l">Paid</div></div>
      <div class="card stat"><div class="n" id="s-collected">0</div><div class="l">Collected</div></div>
    </section>
    <div class="two-col side-left">
      <section class="card">
        <div class="section-head"><h2>What's for sale</h2><button class="btn sm primary" id="add-item">+ Item</button></div>
        <ul class="vlist" id="items"></ul>
        <div class="card-pad small muted" id="share-hint">Buyers order from your RSVP and aso-ebi page. Get the link and set your bank details under <strong>Share &amp; settings</strong>.</div>
      </section>
      <section class="card">
        <div class="toolbar">
          <input type="search" id="q" placeholder="Search buyer or phone">
          <select id="filter" aria-label="Filter"><option value="all">All orders</option><option value="unpaid">Not paid</option><option value="paid">Paid</option><option value="tocollect">Paid, not collected</option><option value="collected">Collected</option></select>
        </div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Buyer</th><th>Item</th><th class="num">Amount</th><th>Paid</th><th>Collected</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div class="empty hidden" id="empty">No orders yet.</div>
      </section>
    </div>
  </main>

  <dialog id="item-dlg"><form method="dialog">
    <h3>Aso-ebi item</h3>
    <div class="field"><label for="i-name">Name</label><input id="i-name" name="name" required placeholder="Emerald gele + lace (5 yards)"></div>
    <div class="grid2 field">
      <div><label for="i-price">Price (₦)</label><input id="i-price" name="price" inputmode="decimal" required placeholder="45,000"></div>
      <div><label for="i-options">Sizes or colours</label><input id="i-options" name="options" placeholder="Small, Medium, Large"></div>
    </div>
    <div class="field"><label for="i-desc">Description</label><textarea id="i-desc" name="description" placeholder="Pick up from Mummy Tolu's house in Surulere from 1 Nov."></textarea></div>
    <label class="inline field"><input type="checkbox" name="active" checked> On sale</label>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form></dialog>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/time.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/section.js"></script>
  <script src="/js/asoebi.js"></script>
</body>
</html>
