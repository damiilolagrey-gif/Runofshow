<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · Run of Show</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#5b2a6e">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="title">
        <h1 id="ev-name">Loading…</h1>
        <div class="muted small" id="ev-sub"></div>
      </div>
      <nav class="sections" id="sections"></nav>
    </div>
  </header>
  <main class="wrap">
    <p class="banner change hidden" id="no-wa" style="margin:0 0 12px"><span class="grow">No WhatsApp Business number is connected yet, so guests’ replies don’t come in here. You can still write to a guest: we open WhatsApp on your phone with your message ready.</span></p>
    <div class="card inbox" id="inbox">
      <aside class="inbox-list">
        <div class="inbox-search"><input type="search" id="q" placeholder="Search or start a chat"></div>
        <ul id="convos"></ul>
      </aside>
      <section class="inbox-chat">
        <div class="inbox-empty" id="pick">
          <div class="muted">Pick a chat, or search for a guest to start one.</div>
        </div>
        <div class="inbox-open hidden" id="open">
          <header class="inbox-head">
            <button class="btn sm ghost back" id="back" type="button" aria-label="Back to chats">←</button>
            <div class="grow">
              <strong id="c-name"></strong>
              <div class="muted small" id="c-sub"></div>
            </div>
            <label class="inline small" title="When on, the RSVP assistant answers this guest for you"><input type="checkbox" id="c-bot"> Assistant replies</label>
          </header>
          <ul class="chat inbox-msgs" id="c-msgs"></ul>
          <form class="inbox-reply" id="c-form">
            <textarea id="c-text" rows="1" maxlength="2000" placeholder="Type a message"></textarea>
            <button class="btn primary" id="c-send">Send</button>
          </form>
          <p class="muted small inbox-note" id="c-note"></p>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/time.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/section.js"></script>
  <script src="/js/inbox.js"></script>
</body>
</html>
